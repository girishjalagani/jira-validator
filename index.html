<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira Migration Validation Assistant</title>
  <style>
    html,body{margin:0;background:#4c4f55;}
    #boot{color:#dfe3e8;font-family:system-ui,Segoe UI,Roboto,sans-serif;padding:40px;font-size:15px;}
  </style>
  <!-- Libraries loaded from CDN; no build step required -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
  <div id="root"><div id="boot">Loading the validator… (first load compiles in your browser and can take a few seconds)</div></div>
  <!-- The app is compiled in the browser by Babel; type="text/babel" tells Babel to transpile it -->
  <script type="text/babel" data-presets="react" src="./app.jsx"></script>
</body>
</html>
